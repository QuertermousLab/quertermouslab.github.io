# Weekly: pull new Quertermous T[Author] records from PubMed and open a pull
# request, so someone can curate (highlight / hide preprints) before merging.
name: Update publications

on:
  schedule:
    - cron: '0 13 * * 1' # Mondays 13:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  papers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 scripts/fetch_pubmed.py
      - uses: peter-evans/create-pull-request@v7
        with:
          branch: bot/update-papers
          commit-message: 'Update publications from PubMed'
          title: 'Update publications from PubMed'
          body: |
            Automated weekly PubMed refresh (`scripts/fetch_pubmed.py`).

            Before merging, check new files in `src/content/papers/`:
            - set `"hidden": true` on preprints that duplicate a published paper
            - set `"highlight": true` (+ `summary`, `image`) for papers to feature
          delete-branch: true
